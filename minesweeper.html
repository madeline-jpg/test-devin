<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minesweeper</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #a5d6a7;
      color: #222;
      user-select: none;
    }
    h1 { margin: 0 0 0.75rem; }
    #levels { margin-bottom: 0.75rem; }
    #levels button {
      font-size: 0.9rem;
      padding: 0.3rem 0.75rem;
      margin: 0 0.15rem;
      cursor: pointer;
    }
    #levels button.active { font-weight: bold; }
    #game {
      background: #c0c0c0;
      padding: 6px;
      border: 3px solid;
      border-color: #fff #7b7b7b #7b7b7b #fff;
    }
    #panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 6px;
      margin-bottom: 6px;
      border: 2px solid;
      border-color: #7b7b7b #fff #fff #7b7b7b;
    }
    .counter {
      background: #000;
      color: #f00;
      font-family: "Courier New", monospace;
      font-weight: bold;
      font-size: 1.6rem;
      padding: 0 4px;
      min-width: 3ch;
      text-align: right;
    }
    #face {
      width: 36px;
      height: 36px;
      font-size: 1.3rem;
      line-height: 1;
      padding: 0;
      cursor: pointer;
      background: #c0c0c0;
      border: 3px solid;
      border-color: #fff #7b7b7b #7b7b7b #fff;
    }
    #face:active { border-color: #7b7b7b #fff #fff #7b7b7b; }
    #board {
      display: grid;
      border: 3px solid;
      border-color: #7b7b7b #fff #fff #7b7b7b;
    }
    .cell {
      width: 24px;
      height: 24px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      background: #c0c0c0;
      border: 3px solid;
      border-color: #fff #7b7b7b #7b7b7b #fff;
    }
    .cell.open {
      border: 1px solid #7b7b7b;
      cursor: default;
    }
    .cell.boom { background: #f00; }
    .n1 { color: #0000ff; } .n2 { color: #007b00; } .n3 { color: #ff0000; }
    .n4 { color: #00007b; } .n5 { color: #7b0000; } .n6 { color: #007b7b; }
    .n7 { color: #000; }    .n8 { color: #7b7b7b; }
    #help { margin-top: 0.75rem; font-size: 0.85rem; color: #333; }
  </style>
</head>
<body>
  <h1>Minesweeper</h1>
  <div id="levels">
    <button data-level="beginner" class="active">Beginner</button>
    <button data-level="intermediate">Intermediate</button>
    <button data-level="expert">Expert</button>
  </div>
  <div id="game">
    <div id="panel">
      <div id="mines" class="counter">000</div>
      <button id="face" title="New game">🙂</button>
      <div id="time" class="counter">000</div>
    </div>
    <div id="board"></div>
  </div>
  <div id="help">Click to reveal · Right-click to flag · Click a number to chord</div>
  <script>
    const LEVELS = {
      beginner: { rows: 9, cols: 9, mines: 10 },
      intermediate: { rows: 16, cols: 16, mines: 40 },
      expert: { rows: 16, cols: 30, mines: 99 },
    };

    const boardEl = document.getElementById('board');
    const minesEl = document.getElementById('mines');
    const timeEl = document.getElementById('time');
    const faceEl = document.getElementById('face');

    let level = LEVELS.beginner;
    let cells, cellEls, started, over, flags, opened, seconds, timer;

    const pad = n => String(Math.max(-99, Math.min(999, n))).padStart(3, '0');

    function neighbors(i) {
      const r = Math.floor(i / level.cols), c = i % level.cols, out = [];
      for (let dr = -1; dr <= 1; dr++) {
        for (let dc = -1; dc <= 1; dc++) {
          const nr = r + dr, nc = c + dc;
          if ((dr || dc) && nr >= 0 && nr < level.rows && nc >= 0 && nc < level.cols) {
            out.push(nr * level.cols + nc);
          }
        }
      }
      return out;
    }

    function newGame() {
      clearInterval(timer);
      const total = level.rows * level.cols;
      cells = Array.from({ length: total }, () => ({ mine: false, open: false, flag: false, count: 0 }));
      started = false;
      over = false;
      flags = 0;
      opened = 0;
      seconds = 0;
      faceEl.textContent = '🙂';
      minesEl.textContent = pad(level.mines);
      timeEl.textContent = pad(0);

      boardEl.style.gridTemplateColumns = `repeat(${level.cols}, 24px)`;
      boardEl.innerHTML = '';
      cellEls = cells.map((_, i) => {
        const el = document.createElement('div');
        el.className = 'cell';
        el.dataset.i = i;
        boardEl.appendChild(el);
        return el;
      });
    }

    function placeMines(safe) {
      const excluded = new Set([safe, ...neighbors(safe)]);
      const candidates = cells.map((_, i) => i).filter(i => !excluded.has(i));
      for (let k = 0; k < level.mines; k++) {
        const j = k + Math.floor(Math.random() * (candidates.length - k));
        [candidates[k], candidates[j]] = [candidates[j], candidates[k]];
        cells[candidates[k]].mine = true;
      }
      cells.forEach((cell, i) => {
        cell.count = neighbors(i).filter(n => cells[n].mine).length;
      });
    }

    function startTimer() {
      started = true;
      timer = setInterval(() => {
        seconds++;
        timeEl.textContent = pad(seconds);
      }, 1000);
    }

    function reveal(i) {
      const stack = [i];
      while (stack.length) {
        const k = stack.pop();
        const cell = cells[k];
        if (cell.open || cell.flag) continue;
        cell.open = true;
        opened++;
        const el = cellEls[k];
        el.classList.add('open');
        if (cell.mine) continue;
        if (cell.count) {
          el.textContent = cell.count;
          el.classList.add('n' + cell.count);
        } else {
          stack.push(...neighbors(k));
        }
      }
    }

    function open(i) {
      const cell = cells[i];
      if (over || cell.flag || cell.open) return;
      if (!started) {
        placeMines(i);
        startTimer();
      }
      if (cell.mine) return lose(i);
      reveal(i);
      checkWin();
    }

    function chord(i) {
      const cell = cells[i];
      if (over || !cell.open || !cell.count) return;
      const around = neighbors(i);
      if (around.filter(n => cells[n].flag).length !== cell.count) return;
      const hit = around.find(n => cells[n].mine && !cells[n].flag);
      if (hit !== undefined) return lose(hit);
      around.forEach(n => reveal(n));
      checkWin();
    }

    function toggleFlag(i) {
      const cell = cells[i];
      if (over || cell.open) return;
      cell.flag = !cell.flag;
      flags += cell.flag ? 1 : -1;
      cellEls[i].textContent = cell.flag ? '🚩' : '';
      minesEl.textContent = pad(level.mines - flags);
    }

    function lose(i) {
      over = true;
      clearInterval(timer);
      faceEl.textContent = '😵';
      cells.forEach((cell, k) => {
        const el = cellEls[k];
        if (cell.mine && !cell.flag) {
          el.classList.add('open');
          el.textContent = '💣';
        } else if (!cell.mine && cell.flag) {
          el.textContent = '❌';
        }
      });
      cellEls[i].classList.add('boom');
    }

    function checkWin() {
      if (opened !== cells.length - level.mines) return;
      over = true;
      clearInterval(timer);
      faceEl.textContent = '😎';
      cells.forEach((cell, k) => {
        if (cell.mine && !cell.flag) {
          cell.flag = true;
          cellEls[k].textContent = '🚩';
        }
      });
      minesEl.textContent = pad(0);
    }

    boardEl.addEventListener('click', e => {
      const i = e.target.dataset.i;
      if (i === undefined) return;
      cells[i].open ? chord(+i) : open(+i);
    });
    boardEl.addEventListener('contextmenu', e => {
      e.preventDefault();
      const i = e.target.dataset.i;
      if (i !== undefined) toggleFlag(+i);
    });
    boardEl.addEventListener('mousedown', e => {
      if (!over && e.button === 0) faceEl.textContent = '😮';
    });
    document.addEventListener('mouseup', () => {
      if (!over) faceEl.textContent = '🙂';
    });
    faceEl.addEventListener('click', newGame);
    document.querySelectorAll('#levels button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#levels button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        level = LEVELS[btn.dataset.level];
        newGame();
      });
    });

    newGame();
  </script>
</body>
</html>
